# Anaconda's settings for SoftglowOS: Bazzite's profile (github.com/ublue-os/bazzite,
# installer/system_files/shared/etc/anaconda/profile.d/bazzite.conf). Without
# it Anaconda falls back to LVM and ext4 with a fixed split between / and /home.
# Unlike Bazzite, geolocation stays on, so language and time zone come preselected.

[Profile]
profile_id = softglowos

[Profile Detection]
# The image keeps Bazzite's os-release ID
os_id = bazzite

[Network]
default_on_boot = FIRST_WIRED_WITH_LINK

[Bootloader]
efi_dir = fedora
menu_auto_hide = True

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1
default_partitioning =
    /     (min 1 GiB, max 70 GiB)
    /home (min 500 MiB, free 50 GiB)
    /var  (btrfs)

[User Interface]
hidden_webui_pages =
    network
