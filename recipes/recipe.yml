# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Published to ghcr.io/kevinschmidt777/softglowos
name: softglowos
description: A Linux desktop for gamers and Twitch streamers, built on Bazzite GNOME.

# NVIDIA variant (open kernel modules, Turing and newer). AMD/Intel follows later.
base-image: ghcr.io/ublue-os/bazzite-gnome-nvidia-open
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      files:
        - google-chrome.repo
      keys:
        - https://dl.google.com/linux/linux_signing_key.pub
    install:
      packages:
        # Native OBS instead of the Flatpak, so NVENC and plugins work without sandbox issues
        - obs-studio
        # Daemon that drives the GoXLR; the Hub talks to its API (its own UI is hidden)
        - https://github.com/GoXLR-on-Linux/goxlr-utility/releases/download/v1.2.4/goxlr-utility-1.2.4-1.x86_64.rpm
        # Hub mixer: gate and compressor for the mic chain, Python bindings
        - lsp-plugins-ladspa
        - python3-pulsectl
        - python3-gstreamer1
        - pipewire-gstreamer
        # One app for the RGB lighting of most vendors (mainboards, RAM, GPUs, peripherals)
        - openrgb
        # Default browser
        - google-chrome-stable

  - type: fonts
    fonts:
      google-fonts:
        - Geist
        - Geist Mono

  - type: gnome-extensions
    install:
      - 4994 # Dash2Dock Animated (macOS-like dock with magnification)
      - 2236 # Night Theme Switcher (light/dark by time of day)
      - 3843 # Just Perfection (clock on the right, no Activities button)

  - type: gschema-overrides
    include:
      - zz1-softglowos.gschema.override

  - type: systemd
    user:
      enabled:
        - goxlr-daemon.service

  # Hub source for install-hub.sh
  - type: copy
    src: apps/hub
    dest: /tmp/softglowos-hub

  - type: script
    scripts:
      - install-discord.sh
      - install-rnnoise.sh
      - install-hub.sh
      - render-branding.sh
      - hide-gnome-donate.sh
      - hide-mixer-from-mic-indicator.sh
      - remove-bazzite-autostart.sh
      - hide-bazzite-apps.sh
      - remove-bazzite-ujust-recipes.sh
      - disable-terra-mesa.sh

  - type: os-release
    properties:
      NAME: SoftglowOS
      PRETTY_NAME: SoftglowOS
      BOOTLOADER_NAME: SoftglowOS
      DEFAULT_HOSTNAME: softglowos
      # Icon name that Settings > System > About shows instead of the Bazzite logo
      LOGO: softglowos-logo
      # Color of "Welcome to SoftglowOS!" while booting: our light teal (#5cc6d6)
      ANSI_COLOR: "0;38;2;92;198;214"
      # Our links instead of Bazzite's (Settings > About and other tools show them).
      # ID stays "bazzite", because Bazzite's own scripts check for it.
      HOME_URL: https://softglowos.com
      DOCUMENTATION_URL: https://softglowos.com
      SUPPORT_URL: https://github.com/kevinschmidt777/softglowos/issues
      BUG_REPORT_URL: https://github.com/kevinschmidt777/softglowos/issues

  # Bakes the new boot splash watermark into the initramfs
  - type: initramfs

  - type: signing
