# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Published to ghcr.io/kevinschmidt777/streamer-os
name: streamer-os
description: A Linux desktop for gamers and Twitch streamers, built on Bazzite GNOME.

# NVIDIA variant (open kernel modules, Turing and newer). AMD/Intel follows later.
base-image: ghcr.io/ublue-os/bazzite-gnome-nvidia-open
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      files:
        - google-chrome.repo
      keys:
        - https://dl.google.com/linux/linux_signing_key.pub
    install:
      packages:
        # Native OBS instead of the Flatpak, so NVENC and plugins work without sandbox issues
        - obs-studio
        # Daemon that drives the GoXLR; our own mixer will talk to its API later
        - https://github.com/GoXLR-on-Linux/goxlr-utility/releases/download/v1.2.4/goxlr-utility-1.2.4-1.x86_64.rpm
        # One app for the RGB lighting of most vendors (mainboards, RAM, GPUs, peripherals)
        - openrgb
        # Default browser
        - google-chrome-stable

  - type: fonts
    fonts:
      google-fonts:
        - Geist
        - Geist Mono

  - type: gnome-extensions
    install:
      - 307 # Dash to Dock
      - 2236 # Night Theme Switcher (light/dark by time of day)
      - 3843 # Just Perfection (clock on the right, no Activities button)

  - type: gschema-overrides
    include:
      - zz1-streamer-os.gschema.override

  - type: systemd
    user:
      enabled:
        - goxlr-daemon.service

  - type: script
    scripts:
      - install-discord.sh
      - render-branding.sh
      - remove-bazzite-autostart.sh

  - type: os-release
    properties:
      NAME: Streamer OS
      PRETTY_NAME: Streamer OS
      BOOTLOADER_NAME: Streamer OS
      DEFAULT_HOSTNAME: streamer-os

  # Bakes the new boot splash watermark into the initramfs
  - type: initramfs

  - type: signing
