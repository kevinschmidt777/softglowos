// For the build containers only: a mirror that stalls (Launchpad's PPA hung
// for 10 minutes on 2026-11-11) gets a timeout and another try instead of
// failing the whole build.
Acquire::Retries "5";
Acquire::http::Timeout "60";
Acquire::https::Timeout "60";
// GitHub's runners have no IPv6 route, and with the host's network apt
// otherwise tries Launchpad's IPv6 addresses first
Acquire::ForceIPv4 "true";
