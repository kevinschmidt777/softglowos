# SoftglowOS's Calamares, built after Ubuntu's flavors that use it (Lubuntu,
# calamares-settings-ubuntu-common), for a live system made by
# ubuntu/iso/build.sh: one squashfs, GRUB with Secure Boot, ext4 and zram.
---
modules-search: [ local ]

instances:
- id: nvidia
  module: shellprocess
  config: shellprocess_nvidia.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@nvidia
  - packages
  - initramfs
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: softglowos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
