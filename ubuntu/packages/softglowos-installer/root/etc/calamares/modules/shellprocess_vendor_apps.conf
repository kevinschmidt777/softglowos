# Chrome and Discord from Google and Discord during the installation, when
# the computer is online, so they're in the dock on the first login. Without
# network the timer of softglowos-vendor-apps fetches them after the first
# boot instead; a failed download never stops the installation.
---
dontChroot: false
timeout: 1200
script:
    - command: "/usr/libexec/softglowos-vendor-apps || true"
