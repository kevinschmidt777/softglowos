# The fallback boot path (EFI/BOOT/BOOTX64.EFI) gets Ubuntu's signed shim with
# GRUB beside it, so an external disk also starts with Secure Boot on another
# PC, or when the firmware forgets its boot entry. Calamares's own fallback
# would copy GRUB without shim. The signed GRUB reads EFI/ubuntu/grub.cfg.
---
dontChroot: true
timeout: 30
script:
    - command: "mkdir -p ${ROOT}/boot/efi/EFI/BOOT"
    - command: "cp ${ROOT}/boot/efi/EFI/ubuntu/shimx64.efi ${ROOT}/boot/efi/EFI/BOOT/BOOTX64.EFI"
    - command: "cp ${ROOT}/boot/efi/EFI/ubuntu/grubx64.efi ${ROOT}/boot/efi/EFI/BOOT/grubx64.efi"
    - command: "cp ${ROOT}/boot/efi/EFI/ubuntu/mmx64.efi ${ROOT}/boot/efi/EFI/BOOT/mmx64.efi || true"
