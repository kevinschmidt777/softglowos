# Bluetooth mice and keyboards paired in the live system
# (softglowos-live-pairing) work at the installed system's login screen too
---
dontChroot: true
timeout: 30
script:
    - command: "test ! -d /var/lib/bluetooth || { mkdir -p ${ROOT}/var/lib/bluetooth && cp -a /var/lib/bluetooth/. ${ROOT}/var/lib/bluetooth/; }"
