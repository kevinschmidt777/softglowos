---
doAutologin: false
setRootPassword: false
sudoersGroup: sudo
defaultGroups:
    - adm
    - cdrom
    - dip
    - lpadmin
    - plugdev
    - sudo
    - name: video
      must_exist: false
    - name: render
      must_exist: false
    - name: gamemode
      must_exist: false
hostname:
    location: EtcFile
    writeHostsFile: true
    template: "softglowos"
passwordRequirements:
    minLength: 8
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root, softglowos, nobody, gdm, daemon, bin, sys ]
