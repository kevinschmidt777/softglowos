# SoftglowOS audio session settings.

# Never suspend sound cards, capture cards or USB interfaces when they are idle.
# Waking a device up again takes a moment and can shift its timing, which is
# exactly the kind of delay a stream must not have (e.g. after switching the
# capture card input).
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.*" }
      { node.name = "~alsa_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]

# Routes apps into the mixer channels and wires up the microphone and the
# capture card, see scripts/softglowos/audio.lua.
wireplumber.components = [
  {
    name = softglowos/audio.lua, type = script/lua
    provides = custom.softglowos-audio
  }
]

wireplumber.profiles = {
  main = {
    custom.softglowos-audio = required
  }
}
