# SoftglowOS: one fixed clock for everything, so audio never gets resampled
# between our mixer nodes and the latency stays the same all the time.
# 256 samples at 48 kHz are about 5.3 ms per cycle.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 256
    default.clock.min-quantum   = 256
    default.clock.max-quantum   = 256
}
