<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <!-- "Lagune": soft cyan, mint and peach clouds on off-white, plus fine grain -->
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="360"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.45" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="3840" height="2160" fill="#f5f4f1"/>
  <g filter="url(#blur)">
    <circle cx="840" cy="600" r="1152" fill="#9fe0e6" opacity="0.75"/>
    <circle cx="3000" cy="1680" r="1248" fill="#7cc7d4" opacity="0.55"/>
    <circle cx="3120" cy="432" r="768" fill="#bfe8d6" opacity="0.7"/>
    <circle cx="1200" cy="1920" r="864" fill="#f6d3bc" opacity="0.6"/>
  </g>
  <rect width="3840" height="2160" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
