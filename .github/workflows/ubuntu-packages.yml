name: Ubuntu packages

# SoftglowOS on Ubuntu (docs/ubuntu-port.md): builds the .deb packages on
# x86_64 and checks that they install on a stock Ubuntu 26.04, that OBS
# finds every plugin and that the drivers and launchers are in place. On
# main it then publishes them as our apt repository on GitHub Pages,
# signed with APT_SIGNING_KEY, together with the newest Heroic and GoXLR
# Utility, Valve's Steam and OpenRGB (ubuntu/fetch-mirrored.sh). Started by hand with "iso", it also
# builds the live ISO (ubuntu/iso/build.sh) as a workflow artifact.
on:
  push:
    branches:
      - main
    paths:
      - "ubuntu/**"
      - "apps/**"
      - "files/**"
      - "VERSION"
      - ".github/workflows/ubuntu-packages.yml"
  workflow_dispatch:
    inputs:
      iso:
        description: Build the live ISO too
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build the packages
        run: ubuntu/build.sh

      - name: Add Heroic, GoXLR Utility, Steam and OpenRGB
        run: ubuntu/fetch-mirrored.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install them on Ubuntu 26.04
        run: |
          docker run --rm -v "$PWD:/src:ro" ubuntu:26.04 bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            # Steam needs the 32-bit libraries
            dpkg --add-architecture i386
            sed -i "s/^Components: main.*/Components: main restricted universe multiverse/" \
              /etc/apt/sources.list.d/ubuntu.sources
            apt-get update -qq
            apt-get install -y -qq ca-certificates >/dev/null
            cp /src/ubuntu/packages/softglowos-obs/root/etc/apt/sources.list.d/obs-studio.sources /etc/apt/sources.list.d/
            cp /src/ubuntu/packages/softglowos-obs/root/usr/share/keyrings/obs-studio-ppa.asc /usr/share/keyrings/
            apt-get update -qq
            # All but the installer, which only belongs to the live ISO
            apt-get install -y -q $(ls /src/ubuntu/out/*.deb | grep -v softglowos-installer)
            echo "### OBS app entry"
            grep -E "^(Exec|PrefersNonDefaultGPU)=" /usr/share/applications/com.obsproject.Studio.desktop
            echo "### OBS plugins and their libraries"
            plugins=/usr/lib/x86_64-linux-gnu/obs-modules/plugins
            missing=$(ldd "$plugins"/*.so | grep "not found" || true)
            [ -z "$missing" ] || { echo "$missing"; exit 1; }
            ls "$plugins" | grep -E "move|record|clone|shader|blur|mask|glow|vkcapture"
            echo "### Drivers: Quick Sync, VA-API, Vulkan"
            dpkg -l intel-media-va-driver-non-free libmfx-gen1.2 libvpl2 mesa-libgallium \
              mesa-vulkan-drivers ubuntu-drivers-common | grep "^ii"
            ls /usr/lib/x86_64-linux-gnu/dri/iHD_drv_video.so /usr/lib/x86_64-linux-gnu/dri/radeonsi_drv_video.so
            echo "### NVIDIA settings"
            ls /usr/lib/modprobe.d/nvidia-power.conf /usr/lib/modprobe.d/nvidia-deck.conf \
              /usr/lib/udev/rules.d/80-nvidia-pm.rules
            [ "$(readlink /etc/systemd/system/nvidia-persistenced.service)" = /dev/null ]
            ls /usr/lib/systemd/user-environment-generators/60-softglowos-nouveau
            echo "### Gaming: launchers with Game Capture and the strong GPU"
            grep -E "^(Name|Exec|PrefersNonDefaultGPU)=" /usr/share/applications/steam.desktop \
              /usr/share/applications/net.lutris.Lutris.desktop
            grep -q "^Exec=env OBS_VKCAPTURE=1 lutris" /usr/share/applications/net.lutris.Lutris.desktop
            grep -q "^Name=Steam$" /usr/share/applications/steam.desktop
            grep -q "/usr/lib/steam/bin_steam.sh" /usr/bin/steam && [ -x /usr/lib/steam/bin_steam.sh ]
            dpkg -l steam-launcher steam-libs-i386:i386 | grep "^ii"
            ls /usr/share/icons/hicolor/256x256/apps/steam.png
            [ ! -e /usr/share/applications/debian-xterm.desktop ] ||
              grep -q "^NoDisplay=true" /usr/share/applications/debian-xterm.desktop
            ls /usr/lib/sysctl.d/*softglowos* /usr/lib/udev/rules.d/60-softglowos-schedulers.rules \
              /etc/systemd/zram-generator.conf
            grep -E "^(Exec|PrefersNonDefaultGPU)=" /usr/share/applications/heroic.desktop
            grep -q "^Exec=env OBS_VKCAPTURE=1 " /usr/share/applications/heroic.desktop
            echo "### Apps"
            flatpak remotes --system | grep flathub
            dpkg-query -W -f="\${Version}\n" openrgb | grep "^1\.1"
            ls /etc/systemd/user/graphical-session.target.wants/goxlr-daemon.service \
              /etc/systemd/user/graphical-session.target.wants/softglowos-streamcontroller.service \
              /usr/share/softglowos/streamcontroller/com_core447_OBSPlugin/main.py \
              /usr/lib/systemd/system/softglowos-vendor-apps.timer
            echo "### Bluetooth keyboards and mice may wake the computer"
            ls /usr/lib/udev/rules.d/90-softglowos-bluetooth-wake.rules
            [ -x /usr/libexec/softglowos-bluetooth-wake ]
            echo "### Other internal disks mount at login without the password"
            [ -x /usr/libexec/softglowos-mount-disks ]
            ls /usr/share/polkit-1/rules.d/50-softglowos-mount-disks.rules \
              /etc/systemd/user/graphical-session.target.wants/softglowos-mount-disks.service
            echo "### Settings > About shows our wordmark"
            cmp /usr/share/pixmaps/ubuntu-logo-text.svg /src/files/system/usr/share/softglowos/branding/wordmark-dark.svg
            cmp /usr/share/pixmaps/ubuntu-logo-text-dark.svg /src/files/system/usr/share/softglowos/branding/wordmark-white.svg
            echo "### Installer: Bluetooth pairing"
            dpkg-deb -c /src/ubuntu/out/softglowos-installer_*.deb | grep -E "softglowos-live-pairing|shellprocess_bluetooth.conf|shellprocess_vendor_apps.conf"
            echo "### Softglow Store"
            grep -q "^Name=Softglow Store$" /usr/share/applications/io.github.kolunmi.Bazaar.desktop
            grep -q "^NoDisplay=true" /usr/share/applications/org.gnome.Software.desktop
            missing=$(ldd /usr/bin/bazaar | grep "not found" || true)
            [ -z "$missing" ] || { echo "$missing"; exit 1; }
          '

      - uses: actions/upload-artifact@v4
        with:
          name: softglowos-ubuntu-packages
          path: ubuntu/out/*.deb
          retention-days: 14

  publish:
    name: Publish the apt repository
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: softglowos-ubuntu-packages
          path: repo

      # A flat repository (Suites: ./), signed like Ubuntu's own
      - name: Index and sign
        working-directory: repo
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          sudo apt-get install -y -qq apt-utils >/dev/null
          apt-ftparchive packages . > Packages
          gzip -k9 Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin=SoftglowOS \
            -o APT::FTPArchive::Release::Label=SoftglowOS release . > Release
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --import <<<"$APT_SIGNING_KEY"
          gpg --batch --yes --clearsign -o InRelease Release
          gpg --batch --yes -abs -o Release.gpg Release
          gpg --armor --export > softglowos-archive.asc
          ls -l

      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo

      - id: deploy
        uses: actions/deploy-pages@v4

  iso:
    name: Build the live ISO
    needs: build
    if: inputs.iso
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: softglowos-ubuntu-packages
          path: debs

      # The system, its squashfs and the ISO need more room than / has
      - name: Prepare the build disk
        run: |
          sudo mkdir -p /mnt/work /mnt/out
          df -h / /mnt

      - name: Build the ISO
        run: |
          docker run --rm --privileged -e WORK=/work \
            -v "$PWD:/src:ro" -v "$PWD/debs:/debs:ro" -v /mnt/work:/work -v /mnt/out:/out \
            ubuntu:26.04 /src/ubuntu/iso/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: softglowos-ubuntu-iso
          path: /mnt/out/*.iso
          compression-level: 0
          retention-days: 14

      - name: Boot it with Secure Boot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf socat imagemagick >/dev/null
          sudo chmod 666 /dev/kvm
          ubuntu/iso/boot-test.sh /mnt/out/*.iso boot-test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: softglowos-ubuntu-iso-boot-test
          path: boot-test
          if-no-files-found: ignore
