name: Ubuntu packages

# The Ubuntu prototype (docs/ubuntu-port.md): builds the .deb packages on
# x86_64 and checks that they install on a stock Ubuntu 26.04, that OBS
# finds every plugin and that the drivers and launchers are in place. On
# ubuntu-base it then publishes them as our apt repository on GitHub Pages,
# signed with APT_SIGNING_KEY, together with the newest Heroic and GoXLR
# Utility (ubuntu/fetch-mirrored.sh).
on:
  push:
    branches:
      - ubuntu-base
    paths:
      - "ubuntu/**"
      - "apps/**"
      - "files/**"
      - "VERSION"
      - ".github/workflows/ubuntu-packages.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build the packages
        run: ubuntu/build.sh

      - name: Add Heroic and GoXLR Utility
        run: ubuntu/fetch-mirrored.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install them on Ubuntu 26.04
        run: |
          docker run --rm -v "$PWD:/src:ro" ubuntu:26.04 bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            # Steam needs the 32-bit libraries
            dpkg --add-architecture i386
            sed -i "s/^Components: main.*/Components: main restricted universe multiverse/" \
              /etc/apt/sources.list.d/ubuntu.sources
            apt-get update -qq
            apt-get install -y -qq ca-certificates >/dev/null
            cp /src/ubuntu/packages/softglowos-obs/root/etc/apt/sources.list.d/obs-studio.sources /etc/apt/sources.list.d/
            cp /src/ubuntu/packages/softglowos-obs/root/usr/share/keyrings/obs-studio-ppa.asc /usr/share/keyrings/
            apt-get update -qq
            apt-get install -y -q /src/ubuntu/out/*.deb
            echo "### OBS app entry"
            grep -E "^(Exec|PrefersNonDefaultGPU)=" /usr/share/applications/com.obsproject.Studio.desktop
            echo "### OBS plugins and their libraries"
            plugins=/usr/lib/x86_64-linux-gnu/obs-modules/plugins
            missing=$(ldd "$plugins"/*.so | grep "not found" || true)
            [ -z "$missing" ] || { echo "$missing"; exit 1; }
            ls "$plugins" | grep -E "move|record|clone|shader|blur|mask|glow|vkcapture|droidcam"
            echo "### Drivers: Quick Sync, VA-API, Vulkan"
            dpkg -l intel-media-va-driver-non-free libmfx-gen1.2 libvpl2 mesa-libgallium \
              mesa-vulkan-drivers ubuntu-drivers-common | grep "^ii"
            ls /usr/lib/x86_64-linux-gnu/dri/iHD_drv_video.so /usr/lib/x86_64-linux-gnu/dri/radeonsi_drv_video.so
            echo "### NVIDIA settings"
            ls /usr/lib/modprobe.d/nvidia-power.conf /usr/lib/modprobe.d/nvidia-deck.conf \
              /usr/lib/udev/rules.d/80-nvidia-pm.rules
            [ "$(readlink /etc/systemd/system/nvidia-persistenced.service)" = /dev/null ]
            ls /usr/lib/systemd/user-environment-generators/60-softglowos-nouveau
            echo "### Gaming: launchers with Game Capture and the strong GPU"
            grep -E "^(Name|Exec|PrefersNonDefaultGPU)=" /usr/share/applications/steam.desktop \
              /usr/share/applications/net.lutris.Lutris.desktop
            grep -q "^Exec=env OBS_VKCAPTURE=1 lutris" /usr/share/applications/net.lutris.Lutris.desktop
            grep -q "^Name=Steam$" /usr/share/applications/steam.desktop
            grep -q "steam.distrib" /usr/games/steam && [ -x /usr/games/steam.distrib ]
            ls /usr/lib/sysctl.d/*softglowos* /usr/lib/udev/rules.d/60-softglowos-schedulers.rules \
              /etc/systemd/zram-generator.conf
            grep -E "^(Exec|PrefersNonDefaultGPU)=" /usr/share/applications/heroic.desktop
            grep -q "^Exec=env OBS_VKCAPTURE=1 " /usr/share/applications/heroic.desktop
            echo "### Apps"
            flatpak remotes --system | grep flathub
            ls /etc/systemd/user/graphical-session.target.wants/goxlr-daemon.service \
              /etc/systemd/user/graphical-session.target.wants/softglowos-streamcontroller.service \
              /usr/share/softglowos/streamcontroller/com_core447_OBSPlugin/main.py \
              /usr/lib/systemd/system/softglowos-vendor-apps.timer
            echo "### Softglow Store"
            grep -q "^Name=Softglow Store$" /usr/share/applications/io.github.kolunmi.Bazaar.desktop
            grep -q "^NoDisplay=true" /usr/share/applications/org.gnome.Software.desktop
            missing=$(ldd /usr/bin/bazaar | grep "not found" || true)
            [ -z "$missing" ] || { echo "$missing"; exit 1; }
          '

      - uses: actions/upload-artifact@v4
        with:
          name: softglowos-ubuntu-packages
          path: ubuntu/out/*.deb
          retention-days: 14

  publish:
    name: Publish the apt repository
    needs: build
    if: github.ref == 'refs/heads/ubuntu-base'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: softglowos-ubuntu-packages
          path: repo

      # A flat repository (Suites: ./), signed like Ubuntu's own
      - name: Index and sign
        working-directory: repo
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          apt-ftparchive packages . > Packages
          gzip -k9 Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin=SoftglowOS \
            -o APT::FTPArchive::Release::Label=SoftglowOS release . > Release
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --import <<<"$APT_SIGNING_KEY"
          gpg --batch --yes --clearsign -o InRelease Release
          gpg --batch --yes -abs -o Release.gpg Release
          gpg --armor --export > softglowos-archive.asc
          ls -l

      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo

      - id: deploy
        uses: actions/deploy-pages@v4
