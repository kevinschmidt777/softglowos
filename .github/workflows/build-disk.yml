name: Build disk images

# Builds the live installer ISO (for every graphics card) and a
# ready-to-boot qcow2 VM disk from the published images. Triggered manually
# because each run takes a while.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build from"
        required: false
        default: "latest"
        type: string

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  # Maintained successor of quay.io/centos-bootc/bootc-image-builder (frozen)
  BIB_IMAGE: ghcr.io/osbuild/bootc-image-builder:v87.0.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  live-iso:
    name: Build live ISO
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      # The live system and both images to install land in podman's storage; a compressed btrfs loopback keeps that within the runner's disk
      - name: Mount container storage
        run: |
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          loop=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$loop" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp /var/lib/containers/storage
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage

      - name: Checkout
        uses: actions/checkout@v7

      # The live desktop runs the AMD/Intel image (nouveau on NVIDIA cards)
      # and installs the image that fits the graphics card
      - name: Build the live system
        run: |
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --cap-add sys_admin --security-opt label=disable \
            --build-arg REGISTRY="$IMAGE_REGISTRY" \
            --build-arg TAG="${{ inputs.tag }}" \
            -t localhost/softglowos-live:latest installer/

      - name: Build the ISO
        id: build
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: localhost/softglowos-live:latest

      # Titanoboa reports where it put the ISO
      - name: Checksum
        env:
          ISO: ${{ steps.build.outputs.iso-dest }}
        run: |
          mkdir upload
          mv "$ISO" upload/softglowos.iso
          cd upload
          sha256sum softglowos.iso | tee softglowos.iso-CHECKSUM

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: softglowos-iso
          path: upload
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  qcow2:
    name: Build qcow2
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Prepare environment
        run: |
          echo "USER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "USER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@v7

      - name: Build disk image
        id: build
        uses: osbuild/bootc-image-builder-action@028e4d28330efe546229eb9cb52aee78174d2347 # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/disk.toml
          image: ${{ env.IMAGE_REGISTRY }}/softglowos:${{ inputs.tag }}
          types: qcow2
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          # Bazzite uses btrfs but does not declare a default root filesystem
          additional-args: --use-librepo=True --rootfs btrfs

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: softglowos-qcow2
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
