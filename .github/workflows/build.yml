name: bluebuild
on:
  schedule:
    - cron:
        "00 06 * * *" # build at 06:00 UTC every day
        # (20 minutes after last ublue images start building)
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          - softglowos.yml # AMD/Intel, also what the ISO installs
          - softglowos-nvidia.yml
    steps:
      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true

      # Beta channel: BlueBuild publishes the beta branch as br-beta-<fedora>.
      # The Hub switches to the fixed name :beta, so it gets the same digest
      # (copied as is, so the cosign signature stays valid).
      - name: Tag the beta channel
        if: github.ref == 'refs/heads/beta'
        env:
          RECIPE: ${{ matrix.recipe }}
          TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${RECIPE%.yml}"
          echo "$TOKEN" | skopeo login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag=$(skopeo list-tags "docker://$image" | jq -r '.Tags[]' | grep -E '^br-beta-[0-9]+$' | sort -V | tail -n1)
          [ -n "$tag" ] || { echo "No br-beta tag found for $image" >&2; exit 1; }
          skopeo copy --all --preserve-digests "docker://$image:$tag" "docker://$image:beta"
